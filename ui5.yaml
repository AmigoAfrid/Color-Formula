# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: colorformula
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - url: https://my421040-api.s4hana.cloud.sap
            authenticationType: SAMLAssertion
            destination: my421040_cust
            path: /sap
          - url: https://my421040-api.s4hana.cloud.sap
            authenticationType: SAMLAssertion
            destination: my421040_cust
            path: /sap/opu/odata/sap/ZSB_YCCODE_1/
          - url: https://my421040-api.s4hana.cloud.sap
            authenticationType: SAMLAssertion
            destination: my421040_cust
            path: /sap/opu/odata/sap/ZSB_INSPECTIONLOT_F4/
          - url: https://my421040-api.s4hana.cloud.sap
            authenticationType: SAMLAssertion
            destination: my421040_cust
            path: /sap/opu/odata/sap/ZSB_COA_IH2P/
          - url: https://my421040-api.s4hana.cloud.sap
            authenticationType: SAMLAssertion
            destination: my421040_cust
            path: /sap/opu/odata/sap/ZCE_ZCOUNT_HEAD_SRVB/
          - url: https://my421040-api.s4hana.cloud.sap
            authenticationType: SAMLAssertion
            destination: my421040_cust
            path: /sap/opu/odata/sap/ZSB_NCLCOA_LONGTEXT/
          - url: https://my421040-api.s4hana.cloud.sap
            authenticationType: SAMLAssertion
            destination: my421040_cust
            path: /sap/opu/odata/sap/ZSB_NCLCOA_CODEGROUP/
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
