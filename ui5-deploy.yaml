    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: my421042_DEV
          url: https://my421042.s4hana.cloud.sap
          authenticationType: reentranceTicket
        app:
          name: ZF_COLORFORMULA
          description: Color Formula
          package: ZFIORI
          transport: P42K900613 
        exclude:
          - /test/
